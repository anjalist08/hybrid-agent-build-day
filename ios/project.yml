# Generate the Xcode project with:  cd ios && xcodegen
# Per-developer values (team, bundle prefix, backend URL) live in Config/Local.xcconfig.
name: Lens
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # Native SwiftUI renderer for OpenUI Lang. Pinned: single-commit repo, no releases, no license file yet.
  OpenUI:
    url: https://github.com/martinmitrevski/OpenUI.git
    revision: 5979833d5793aabd3df6466f1395125c62a4f87a
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  Lens:
    type: application
    platform: iOS
    # Single shared scheme that runs the app (and builds the extension with it), so Xcode
    # never offers the extension scheme with its "Choose an app to run" prompt.
    scheme: {}
    sources: [Lens, Shared]
    dependencies:
      - target: LensBroadcast
      - package: OpenUI
    info:
      path: Lens/Info.plist
      properties:
        CFBundleDisplayName: Lens
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Lens listens while you hold the mic button so you can ask about what you've seen.
        NSSpeechRecognitionUsageDescription: Lens turns your question into text on this device.
        NSLocalNetworkUsageDescription: Lens sends screenshots and questions to your own Lens server on this network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # backend runs on a laptop over plain http during the demo
        LensAppGroup: group.$(BUNDLE_PREFIX).lens
        LensBackendURL: $(LENS_BACKEND_URL)
    entitlements:
      path: Lens/Lens.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).lens]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).lens

  LensBroadcast:
    type: app-extension
    platform: iOS
    sources: [LensBroadcast, Shared]
    dependencies:
      - sdk: ReplayKit.framework
    info:
      path: LensBroadcast/Info.plist
      properties:
        CFBundleDisplayName: Lens Capture
        LensAppGroup: group.$(BUNDLE_PREFIX).lens
        LensBackendURL: $(LENS_BACKEND_URL)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: LensBroadcast/LensBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).lens]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).lens.broadcast

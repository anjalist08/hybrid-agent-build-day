[project]
name = "lens-backend"
version = "0.1.0"
description = "Lens: hybrid personal-context agent backend (screen ingest, knowledge base, voice queries)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

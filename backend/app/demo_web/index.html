else if(stage==='sharing')html=heading('Exactly what leaves<br>your device.','One search. Only what it needs.')+`<div class="card"><div class="eyebrow">Shared for ticket search</div><div class="row"><span>Event</span><span>Maggie Rogers · Fox Theater · Nov 13</span></div><div class="row"><span>Budget</span><span>Under $${esc(budget())} per ticket</span></div></div><div class="card"><h3>Stays on your device</h3><p>Your inbox, calendar details, listening history, contacts and saved preferences.</p></div><p class="tiny">This permission is for one search. Your connected apps are not shared with ticket sites.</p><div class="spacer"></div>`+btn('Back to permission','permission','primary white');
else if(stage==='local')html=heading('We can keep it local.','Nothing has been shared.')+eventCard()+`<p class="reply">Your concert suggestion is still here. You can approve a ticket search whenever you’re ready.</p>`+btn('Review search permission','permission')+btn('Back to suggestions','home','text-button');
else if(stage==='searching')html=heading('Finding your tickets.','Searching live listings under $'+esc(state.budget||budget())+'.')+eventCard()+`<div class="search-circle">${icon('ticket')}</div><h3>Checking availability &amp; total prices</h3><div class="chips"><span class="chip">${icon('sliders')}$${esc(state.budget||100)} budget</span> <span class="chip">${icon('globe')}Online</span></div><div class="notice">${icon('check')}<div><strong>One-time search approved</strong><p>Only the event and your budget were shared. Your connected apps stay private.</p></div></div>`+btn('Continue Search','results','primary',!state.searched);
else if(stage==='tickets'||stage==='seated'){const only=state.seated_only;html=heading(only?'Seated tickets only.':'Three ways to be<br>there.',only?'A little more comfort. Still under $'+state.budget+'.':'All under $'+state.budget+'. All prices include fees.')+eventCard()+`<div class="ticket-options">${(data?.tickets||[]).map(t=>`<button class="option ${state.selected===t.id?'selected':''}" data-action="select" data-id="${t.id}" aria-pressed="${state.selected===t.id}"><strong>$${t.price} — ${esc(t.title)}</strong><span class="radio"></span><p>${esc(t.detail)}</p><div class="fees">Ticketmaster · fees included <span role="link" tabindex="0" data-detail="${t.id}">View details</span></div></button>`).join('')}</div>${data?.tickets.length?'':'<p class="sub">No tickets match that budget. Try a higher amount.</p>'}<p class="tiny">Checked 9:41 AM · Availability may change. ${state.selected?'Nothing purchased or reserved.':'Nothing selected or purchased.'}</p>`+btn('Continue','drafts','primary',!state.selected)+btn(only?'Show all options':'Refine the tickets','refine','text-button');}
else if(stage==='drafts'){const t=selected();html=heading('Ready when you are.','Invite Mia and add this to my calendar.')+`<div class="draft"><div class="draft-head"><h3>Invitation</h3><span class="chip">${icon('mail')}${state.invited?'Sent':'Draft · Not sent'}</span></div><div class="row"><span class="key">To</span><button data-edit="to">${esc(draftTo)}${icon('edit')}</button></div><div class="row"><span class="key">Subject</span><button data-edit="subject">${esc(draftSubject)}${icon('edit')}</button></div><p>Want to see Maggie Rogers at the Fox on Fri, Nov 13 at 8 PM? I’m looking at $${t?.price} ${t?.id==='standing'?'standing tickets':t?.id==='view'?'loge seats':'balcony seats'}. Tickets aren’t booked yet.</p>`+btn(icon(state.invited?'check':'mail')+(state.invited?'Invitation sent':'Send invite'),'send','primary purple-bg',state.invited)+`</div><div class="draft"><div class="draft-head"><h3>Calendar</h3><span class="chip">${icon('calendar')}${state.calendar?'Saved':'Draft · Not saved'}</span></div><div class="row"><span class="key">Title</span><button data-edit="title">${esc(draftTitle)}${icon('edit')}</button></div><div class="row"><span class="key">When</span><span>Fri, Nov 13 · 8–10:30 PM</span></div><div class="row"><span class="key">Where</span><span>Fox Theater, Oakland</span></div><div class="row"><span class="key">Calendar</span><span>Personal · Alert 1 hour before</span></div>`+btn(icon(state.calendar?'check':'calendar')+(state.calendar?'Added to calendar':'Add to calendar'),'save-calendar','primary purple-bg',state.calendar)+`</div><p class="tiny">Nothing is sent or saved until you confirm each action.</p>`+(state.invited&&state.calendar?btn('Continue','confirmed'):'');}
else if(stage==='confirmed')html=heading('A plan is taking shape.','You confirmed both actions.')+eventCard()+`<div class="card"><div class="sent-row"><span class="check">${icon('check')}</span><div><h3>Invitation sent</h3><p>Gmail · Today at 9:41 AM</p><p style="margin-top:10px;color:#555">To &nbsp; ${esc(draftTo)}</p><p style="margin-top:8px">Awaiting Mia’s reply.</p></div></div><div class="sent-row"><span class="check">${icon('check')}</span><div><h3>Added to Personal</h3><p>Calendar · Today at 9:41 AM</p><p style="margin-top:12px">Fri, Nov 13 · 8–10:30 PM · Tentative<br>Alert set for 7 PM.</p><button data-action="drafts" class="purple" style="font-size:12px;padding:8px 0">Edit event</button></div></div></div><p class="tiny">Your $${selected()?.price} seat is still just a plan. No tickets have been purchased or reserved.</p><div class="spacer"></div>`+btn('Continue','memory');
else if(stage==='memory')html=heading('For next time?','A small preference. Entirely your call.')+`<div class="memory-box"><span class="chip">${icon('shield')}Not saved yet</span><p>If you choose Remember, I’ll prioritize seats for future concerts. You can edit or forget this preference anytime.</p></div>${privacy()}`+btn('Remember','remember')+btn('Just this time','skip-memory','secondary');
else if(stage==='plan')html=heading('Friday, looking good.','The plan is saved. The night is still yours.')+eventCard(true)+`<div class="card final-list"><div class="sent-row"><span class="check">${icon('ticket')}</span><div><h3>$${selected()?.price||85} — ${esc(selected()?.title||'Seated')}</h3><p>${esc(selected()?.detail||'Balcony · Row J')} · Not purchased</p></div></div><div class="sent-row"><span class="check">${icon('mail')}</span><div><h3>Mia is invited</h3><p>Email sent · Waiting for her reply</p></div></div><div class="sent-row"><span class="check">${icon('calendar')}</span><div><h3>Friday is on your calendar</h3><p>8–10:30 PM · Personal · Tentative</p></div></div>${state.remembered?`<div class="sent-row"><span class="check">${icon('shield')}</span><div><h3>Seated concerts, remembered</h3><p>Saved on device · <button data-action="memory" style="color:#aaa;font-size:12px;padding:0">Edit anytime</button></p></div></div>`:''}</div>`+btn(icon('arrow')+'Review ticket listing','listing')+`<p class="tiny" style="margin-top:10px">A ticket purchase would happen on the provider’s site, with a separate checkout. Nothing is booked.</p><div style="display:flex;justify-content:space-between">${btn('Edit plan','drafts','text-button')}${btn('Start over','restart','text-button')}</div>`;
else if(stage==='listing')html=heading('Your ticket option.','Take another look before you decide.')+eventCard()+`<div class="card"><h2>$${selected()?.price} — ${esc(selected()?.title)}</h2><p>${esc(selected()?.detail)}<br>All fees included · Per ticket</p></div><p class="sub">Tickets haven’t been purchased or reserved. Checkout is a separate step on the ticket provider’s site.</p>`+btn(returnStage==='plan'?'Back to your plan':'Back to ticket options','listing-back');
else if(stage==='memories')html=heading('Your recent context.','A few things you’ve been exploring.')+`<div id="memory-list" class="loading">Loading your recent activity…</div>`;
else if(stage==='answer')html=heading('Here’s what I found.','From your recent context.')+`<div id="answer-content">${reply}</div>`;
else if(stage==='commute')html=heading('A little extra time.','Your usual morning route.')+`<div class="card"><h2>Leave by 9:50 AM</h2><p>Rain expected at 10 AM. Your usual route adds 12 minutes.</p></div>`+btn('Back to suggestions','home');
else if(stage==='reading')html=heading('A quieter morning.','Something you saved for later.')+`<div class="card"><h2>Finding your flow</h2><p>Make room for one thing at a time. Give it your full attention, silence the interruptions, and let a quiet morning become a little more focused.</p><p style="margin-top:12px">Saved Tuesday · 6 min read</p></div>`+btn('Back to suggestions','home');
else if(stage==='edit')html=heading('Make it yours.','Update the draft before you confirm.')+`<form id="edit-form"><label for="edit-value" class="sub">${esc(editField)}</label><input id="edit-value" class="field" value="${esc(editValue)}" required maxlength="200"><button class="primary" type="submit">Save draft</button></form>`+btn('Cancel','drafts','text-button');
$('content').innerHTML=html;$('assistant').innerHTML=footer();document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>handle(b.dataset.action,b.dataset.id));document.querySelectorAll('[data-detail]').forEach(b=>{b.onclick=async e=>{e.stopPropagation();returnStage=stage;await run('select',{option_id:b.dataset.detail},'listing')};b.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();b.click()}}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));const composer=$('composer');if(composer)composer.onsubmit=e=>{e.preventDefault();submit($('request').value.trim())};const editForm=$('edit-form');if(editForm)editForm.onsubmit=e=>{e.preventDefault();const v=$('edit-value').value.trim();if(!v)return;if(editField==='to')draftTo=v;if(editField==='subject')draftSubject=v;if(editField==='title')draftTitle=v;go('drafts')};updateBusy()}
let editField='',editValue='';function edit(field){editField=field;editValue={to:draftTo,subject:draftSubject,title:draftTitle}[field];go('edit')}
function budget(){return Number((requestText.match(/(?:under|below|up to|\$)\s*\$?\s*(\d+)/i)||[])[1]||100)}
async function handle(action,id){if(busy)return;if(action==='restart'){session=crypto.randomUUID();sessionStorage.setItem('lens-cuj-id',session);data=null;requestText='Find me tickets under $100.';await run('start',{},'home');return}if(action==='search'){go('searching');await run('search',{text:requestText,online_approved:true},'searching');return}if(action==='listing'){returnStage='plan';go('listing');return}if(action==='listing-back'){go(returnStage);return}if(action==='results'){go('tickets');return}if(action==='select'){await run('select',{option_id:id});return}if(action==='apply-refine'){await run('refine',{text:'Only seated tickets'},'seated');return}if(action==='refine'&&data?.state.seated_only){await run('refine',{text:'Show all options'},'tickets');return}if(action==='send'||action==='save-calendar'){await run(action==='send'?'invite':'calendar',{},undefined);if(data?.state.invited&&data?.state.calendar)go('confirmed');return}if(action==='remember'||action==='skip-memory'){await run('remember',{remember:action==='remember'},'plan');return}if(action==='back'){go(['detail','plan','memories','answer'].includes(stage)?'home':'detail');return}if(action==='not-now'){document.querySelector('.suggestion')?.remove();return}if(action==='memory'&&stage==='home'){await showMemories();return}if(action==='ask-home'){await showMemories();$('request')?.focus();return}go(action)}
async function showMemories(){go('memories');try{const r=await fetch('/impressions?limit=5');if(!r.ok)throw Error('Could not load your activity.');const rows=await r.json();$('memory-list').className='';$('memory-list').innerHTML=rows.map(r=>`<button class="option" data-title="${esc(r.title)}"><strong>${esc(r.title)}</strong><p>${esc(r.app)} · ${esc(r.author||'')}</p></button>`).join('')||'<p class="sub">No activity yet.</p>';document.querySelectorAll('[data-title]').forEach(b=>b.onclick=()=>askMemory('Tell me about '+b.dataset.title))}catch(e){$('error').textContent=e.message}}
async function askMemory(q){if(busy)return;busy=true;reply='<p class="loading">Thinking…</p>';go('answer');try{const r=await fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:q,source:'web-cuj'})});if(!r.ok)throw Error('Could not answer that question.');const result=await r.json();reply='<p class="reply">'+esc(result.answer.speech.replace(/^In this demo, /i,'').replace(/^In this fictional history, /i,'').replace(/fictional browsing history/g,'recent activity').replace(/demo history/g,'recent history'))+'</p>'+result.answer.ui.components.filter(c=>c.type!=='text').map(c=>`<div class="card"><h3>${esc(c.title||'')}</h3>${c.body?'<p>'+esc(c.body)+'</p>':''}${(c.items||[]).map(i=>`<div class="row"><span>${esc(i.title)}<br><small class="muted">${esc(i.subtitle||i.meta||'')}</small></span></div>`).join('')}${(c.bars||[]).map(b=>`<div class="row"><span>${esc(b.label)}</span><strong>${esc(b.value)} min</strong></div>`).join('')}</div>`).join('');render()}catch(e){$('error').textContent=e.message}finally{busy=false;updateBusy()}}
async function submit(q){if(!q||busy)return;if(/mia|free|available/i.test(q)){await run('ask',{text:q});reply=data.message;go('context')}else if(/seated|sitting|sit down/i.test(q)&&data?.state.searched){await run('refine',{text:q},'seated')}else if(/invite|calendar/i.test(q)&&data?.state.selected){go('drafts')}else if(/ticket|under\s*\$|\$\d/i.test(q)){requestText=q;go('voice')}else await askMemory(q)}
render();run('start');
</script></body></html>
